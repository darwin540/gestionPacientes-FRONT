<div class="servicio-list-container">
  <div class="header-actions">
    <h2>Lista de Servicios</h2>
    <a routerLink="/servicios/nuevo" class="btn-primary">Nuevo Servicio</a>
  </div>

  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <div *ngIf="isLoading" class="loading">
    Cargando servicios...
  </div>

  <div *ngIf="!isLoading && servicios.length === 0" class="empty-state">
    No hay servicios registrados
  </div>

  <table *ngIf="!isLoading && servicios.length > 0" class="data-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre Completo</th>
        <th>Abreviatura</th>
        <th>Fecha Creación</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let servicio of servicios">
        <td>{{ servicio.id }}</td>
        <td>{{ servicio.nombreCompleto }}</td>
        <td>{{ servicio.abreviatura }}</td>
        <td>{{ servicio.fechaCreacion | date:'short' }}</td>
        <td class="actions">
          <a [routerLink]="['/servicios', servicio.id, 'editar']" class="btn-edit">Editar</a>
          <button (click)="eliminarServicio(servicio.id)" class="btn-delete">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
